<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>GUTENG 商品管理后台</title><style>
:root{--brand:#07505b;--green:#269b79;--bg:#f4f7f5;--ink:#203230}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:var(--ink)}main{max-width:1000px;margin:28px auto;padding:16px}.card{background:white;border:1px solid #e4ebe7;border-radius:16px;padding:18px;margin:14px 0}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}h1{color:var(--brand);font-size:22px}label{display:block;font-size:13px;margin:12px 0;font-weight:650}input,textarea,select{display:block;width:100%;padding:11px;border:1px solid #d9e4de;border-radius:10px;margin-top:6px;font:inherit}textarea{min-height:70px}button{border:0;border-radius:10px;padding:11px 15px;background:var(--brand);color:#fff;font:inherit;cursor:pointer}.secondary{background:#eaf2ef;color:var(--brand)}.danger{background:#a43d3d}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.products{display:grid;gap:10px}.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid #edf1ee;border-radius:12px;padding:12px}.muted{color:#788783;font-size:12px}.hidden{display:none!important}.status{padding:5px 9px;border-radius:20px;background:#e9f5ee;color:#236c4c;font-size:12px}.notice{background:#fff5e8;padding:12px;border-radius:10px;font-size:13px;line-height:1.6}.actions{display:flex;gap:8px;flex-wrap:wrap}.price{font-weight:700;color:#a56d20}@media(max-width:650px){.grid{grid-template-columns:1fr}.item{grid-template-columns:1fr}}
</style></head><body><main><div class="head"><div><h1>GUTENG 商品管理后台</h1><div class="muted">古藤国际百货 · 管理员专用</div></div><a href="/" style="color:var(--brand)">返回商城</a></div>
<section id="login" class="card"><h2>管理员登录</h2><p class="muted">使用部署时设置的后台管理员密码登录。</p><form id="loginForm"><label>管理员密码<input type="password" name="password" required autocomplete="current-password"></label><button>登录后台</button></form><p id="loginMsg" class="muted"></p></section>
<section id="app" class="hidden"><div class="card head"><div><b>商品目录</b><div class="muted">商品保存到 Cloudflare D1 数据库，前台只显示已上架商品。</div></div><div class="actions"><button class="secondary" onclick="newProduct()">＋ 新增商品</button><button class="secondary" onclick="loadProducts()">刷新</button><button class="danger" onclick="logout()">退出登录</button></div></div>
<div class="card hidden" id="editor"><h2 id="formTitle">新增商品</h2><form id="productForm"><input type="hidden" name="id"><div class="grid"><label>商品名称 *<input name="name" required maxlength="120"></label><label>SKU 编码 *<input name="sku" required maxlength="64"></label><label>商品分类 *<select name="category"><option>家居生活</option><option>日用百货</option><option>服饰箱包</option><option>数码配件</option><option>美妆个护</option><option>宠物用品</option><option>旅行出行</option><option>其他</option></select></label><label>人民币售价（CNY）*<input name="price_cny" type="number" min="0.01" step="0.01" required></label><label>库存数量 *<input name="stock" type="number" min="0" step="1" required></label><label>商品图标（没有图片时显示）<input name="icon" maxlength="8" placeholder="🛍️"></label><label>商品图片 URL<input name="image_url" type="url" placeholder="https://..."></label><label>卡片背景色<input name="color" type="color" value="#e8f0e9"></label><label>上架状态<select name="status"><option value="draft">草稿（不上架）</option><option value="active">上架</option></select></label><label>履约方式<select name="fulfillment"><option value="auto">自动分配（后续接物流）</option><option value="cn_direct">中国直发</option><option value="overseas_warehouse">海外仓</option></select></label></div><label>商品描述<textarea name="description" maxlength="3000"></textarea></label><label>目标市场代码（逗号分隔）<input name="market_codes" value="AU,US,GB,CA,NZ" placeholder="AU,US,GB,CA,NZ"></label><label>各市场售价 JSON（可暂留空）<textarea name="currency_prices" placeholder='{"AUD":19.9,"USD":14.9,"GBP":12.9,"CAD":19.9,"NZD":24.9}'></textarea></label><div class="actions"><button type="submit">保存商品</button><button type="button" class="secondary" onclick="closeEditor()">取消</button></div></form><p class="muted">注意：图片 URL 目前由外部图片地址提供；真实文件上传需后续绑定 Cloudflare R2。各市场售价必须由你确认，系统不会自动编造汇率。</p></div>
<div class="card"><div class="head"><b>商品列表</b><span id="summary" class="muted"></span></div><div id="list" class="products">加载中…</div></div>
<div class="notice">安全说明：管理员密码仅通过 Worker Secret 校验；登录会话由服务端签发。请勿把密码、PayPal Secret 或其他密钥写入网页代码。</div></section></main>
<script>
const $=s=>document.querySelector(s);let all=[];async function api(url,opt={}){let r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});let j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||('请求失败 '+r.status));return j}
async function check(){try{await api('/api/admin/me');$('#login').classList.add('hidden');$('#app').classList.remove('hidden');loadProducts()}catch(e){}}
$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginMsg').textContent='正在登录…';try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:new FormData(e.target).get('password')})});$('#login').classList.add('hidden');$('#app').classList.remove('hidden');loadProducts()}catch(err){$('#loginMsg').textContent=err.message}};
async function logout(){try{await api('/api/admin/logout',{method:'POST',body:'{}'})}catch(e){}location.reload()}
async function loadProducts(){try{let j=await api('/api/admin/products');all=j.products||[];$('#summary').textContent=`共 ${all.length} 件`;$('#list').innerHTML=all.map(p=>`<div class="item"><div><b>${esc(p.name)}</b> <span class="status">${p.status==='active'?'已上架':p.status==='draft'?'草稿':'已归档'}</span><div class="muted">SKU：${esc(p.sku)} · ${esc(p.category)} · 库存 ${p.stock} · <span class="price">¥${Number(p.price_cny).toFixed(2)}</span></div></div><div class="actions"><button class="secondary" onclick="editProduct('${p.id}')">编辑</button>${p.status==='active'?`<button class="secondary" onclick="toggleStatus('${p.id}','draft')">下架</button>`:`<button onclick="toggleStatus('${p.id}','active')">上架</button>`}<button class="danger" onclick="archiveProduct('${p.id}')">归档</button></div></div>`).join('')||'<p class="muted">还没有商品，点击“新增商品”开始创建。</p>'}catch(e){$('#list').textContent=e.message}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function newProduct(){let f=$('#productForm');f.reset();f.elements.id.value='';f.elements.color.value='#e8f0e9';f.elements.market_codes.value='AU,US,GB,CA,NZ';$('#formTitle').textContent='新增商品';$('#editor').classList.remove('hidden');scrollTo(0,0)}
function closeEditor(){$('#editor').classList.add('hidden')}
function editProduct(id){let p=all.find(x=>x.id===id);if(!p)return;let f=$('#productForm');for(let k of ['id','name','sku','category','price_cny','stock','icon','image_url','color','status','fulfillment','description'])f.elements[k].value=p[k]??'';f.elements.market_codes.value=(p.market_codes||[]).join(',');f.elements.currency_prices.value=JSON.stringify(p.currency_prices||{},null,2);$('#formTitle').textContent='编辑商品';$('#editor').classList.remove('hidden');scrollTo(0,0)}
$('#productForm').onsubmit=async e=>{e.preventDefault();let f=e.target,d=Object.fromEntries(new FormData(f));d.price_cny=Number(d.price_cny);d.stock=Number(d.stock);d.market_codes=d.market_codes.split(',').map(x=>x.trim().toUpperCase()).filter(Boolean);try{d.currency_prices=d.currency_prices.trim()?JSON.parse(d.currency_prices):{}}catch(e){alert('各市场售价 JSON 格式不正确');return}try{let id=d.id;delete d.id;if(id)await api('/api/admin/products/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify(d)});else await api('/api/admin/products',{method:'POST',body:JSON.stringify(d)});closeEditor();await loadProducts();alert('商品已保存到数据库')}catch(err){alert(err.message)}};
async function toggleStatus(id,status){try{let p=all.find(x=>x.id===id);await api('/api/admin/products/'+id,{method:'PUT',body:JSON.stringify({...p,status})});loadProducts()}catch(e){alert(e.message)}}
async function archiveProduct(id){if(!confirm('确认归档该商品？归档后不会在商城显示。'))return;try{await api('/api/admin/products/'+id,{method:'DELETE'});loadProducts()}catch(e){alert(e.message)}}check();
</script></body></html>
