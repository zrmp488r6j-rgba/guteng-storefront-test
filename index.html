<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07505b"><meta name="description" content="古藤国际百货 GUTENG，精选品质生活好物。">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<title>古藤国际百货 GUTENG</title>
<style>
:root{--brand:#07505b;--green:#269b79;--gold:#d5a84f;--bg:#f5f7f6;--ink:#172b2d;--muted:#7b8988}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;line-height:1.45}a{text-decoration:none;color:inherit}img{max-width:100%;display:block}button,input,textarea,select{font:inherit}.wrap{max-width:1200px;margin:0 auto;padding:16px 16px 110px}.top{display:flex;justify-content:space-between;align-items:center;padding:12px 0 16px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:44px;height:44px;border-radius:12px;box-shadow:0 10px 26px rgba(7,80,91,.18)}.brand b{display:block;font-size:1.02rem}.brand small{color:var(--muted)}.actions{display:flex;align-items:center;gap:12px}.pill{display:inline-flex;align-items:center;padding:8px 12px;border-radius:999px;background:rgba(38,155,121,.09);color:var(--green);font-size:.85rem;font-weight:600}.badge{position:absolute;right:-8px;top:-8px;background:var(--gold);color:#fff;border-radius:999px;padding:2px 7px;font-size:.72rem;min-width:18px;text-align:center}.cartbtn{position:relative}.hero{display:grid;grid-template-columns:1.3fr .7fr;gap:22px;align-items:center;background:linear-gradient(135deg,#0c4a4e,#1d6f67 55%,#1db38d);color:white;border-radius:28px;padding:26px 24px;box-shadow:0 24px 50px rgba(7,80,91,.16)}.hero h1{margin:0 0 8px;font-size:clamp(2rem,4vw,3.2rem);line-height:1.05}.hero p{margin:0 0 8px;font-size:1.02rem;opacity:.95}.search{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:8px 12px}.search input{flex:1;border:none;background:transparent;color:#fff;outline:none}.search input::placeholder{color:rgba(255,255,255,.75)}.cats{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 12px}.cat{display:flex;align-items:center;gap:8px;border:1px solid rgba(23,43,45,.08);background:#fff;border-radius:16px;padding:10px 14px;color:var(--ink);cursor:pointer;transition:.2s}.cat.active{background:var(--brand);color:#fff;border-color:var(--brand)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.product{background:#fff;border:1px solid rgba(23,43,45,.06);border-radius:22px;overflow:hidden;box-shadow:0 12px 30px rgba(23,43,45,.05);cursor:pointer;display:flex;flex-direction:column}.photo{position:relative;height:220px;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.tag{position:absolute;left:12px;bottom:12px;background:rgba(7,80,91,.9);color:#fff;border-radius:999px;padding:6px 10px;font-size:.72rem}.info{padding:14px 14px 18px}.info .row{display:flex;justify-content:space-between;align-items:start;gap:8px}.info h3{margin:0;font-size:1.02rem;line-height:1.35}.meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.price{font-size:1.15rem;font-weight:700;color:var(--brand)}.stock{color:var(--muted);font-size:.82rem}.addbtn{border:none;border-radius:12px;background:var(--brand);color:#fff;padding:10px 12px;cursor:pointer}.addbtn:disabled{opacity:.55;cursor:not-allowed}.page{display:none}.page.show{display:block}.panel{background:#fff;border-radius:22px;padding:18px;border:1px solid rgba(23,43,45,.06);box-shadow:0 8px 20px rgba(23,43,45,.04)}.empty{padding:30px 20px;text-align:center;color:var(--muted)}.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);border-top:1px solid rgba(23,43,45,.08);display:flex;justify-content:center;z-index:20}.navinner{max-width:720px;width:100%;display:grid;grid-template-columns:repeat(5,1fr)}.nav button{border:none;background:transparent;color:var(--muted);padding:12px 8px 16px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}.nav button.active{color:var(--brand)}.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);padding:11px 18px;border-radius:999px;background:rgba(23,43,45,.9);color:#fff;font-size:.88rem;z-index:50}.modal{position:fixed;inset:0;background:rgba(17,24,39,.35);display:none;align-items:center;justify-content:center;padding:18px;z-index:40}.modal.show{display:flex}.sheet{background:#fff;border-radius:28px;width:min(760px,100%);max-height:82vh;overflow:auto;padding:18px 18px 20px;box-shadow:0 18px 48px rgba(17,24,39,.2)}.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.close{border:none;background:#f1f5f4;border-radius:10px;width:34px;height:34px;cursor:pointer}.detail{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}.detailpic{border-radius:26px;height:340px;overflow:hidden;background:#eef3ee}.detailpic img{width:100%;height:100%;object-fit:cover}.detail h2{margin:4px 0 6px;font-size:1.8rem}.detail .price{font-size:2rem}.detail .desc{color:var(--muted);line-height:1.8}.qty{display:flex;align-items:center;gap:12px;margin:12px 0 16px}.qty button{width:36px;height:36px;border:none;border-radius:10px;background:#eef3ee;color:var(--ink);cursor:pointer}.cartitem{display:grid;grid-template-columns:76px 1fr auto;align-items:center;gap:12px;background:#fff;border:1px solid rgba(23,43,45,.06);border-radius:18px;padding:12px;margin-bottom:12px}.cartitem img{width:76px;height:76px;border-radius:14px;object-fit:cover}.cartitem .name{font-weight:600}.cartitem .meta{margin-top:4px;display:flex;align-items:center;justify-content:space-between}.listline{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(23,43,45,.05)}.mini{color:var(--muted);font-size:.8rem}.cbutton{border:none;border-radius:10px;background:#eef3ee;padding:8px 12px;cursor:pointer}.checkoutbox{margin-top:16px}.checkoutbox button{width:100%;border:none;background:var(--brand);color:#fff;padding:14px;border-radius:14px;cursor:pointer}.checkoutbox button:disabled{opacity:.7;cursor:not-allowed}.ordercard{background:#fff;border:1px solid rgba(23,43,45,.06);border-radius:18px;padding:16px;margin-bottom:12px}.@media (max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:1fr}.detail{grid-template-columns:1fr}}@media (max-width:520px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;gap:12px;flex-direction:column}.navinner{grid-template-columns:repeat(5,minmax(0,1fr))}.brand{align-items:center}} </style></head><body><div class="wrap">
<header class="top"><div class="brand"><img src="icon-192.png" alt="古藤国际百货标志"><div><b>古藤国际百货</b><small>GUTENG · 品质生活精选</small></div></div><div class="actions"><span class="pill">古藤自营</span><button class="cartbtn cbutton" data-tab="cart">购物车 <span id="badge" class="badge"></span></button></div></header>
<main id="home"><section class="hero"><div><h1>发现品质好物</h1><p>精选日常好物 · 焕新美好生活</p><p style="margin-top:14px"><span class="pill">古藤自营 · 用心精选</span></p></div><div class="panel" style="background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12);color:#fff"><div class="search"><span>⌕</span><input id="search" type="search" placeholder="搜索商品、分类…"></div><div style="margin-top:12px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px"><div class="panel" style="background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12);padding:12px;border-radius:16px"><div class="mini" style="opacity:.85">精选品类</div><b id="catCount">0</b></div><div class="panel" style="background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12);padding:12px;border-radius:16px"><div class="mini" style="opacity:.85">库存状态</div><b>已上架</b></div></div></div></section>
<div class="cats" id="cats"></div>
<div class="grid" id="products"></div></main>
<main id="category" class="page"><h2>全部分类</h2><div class="panel" id="categoryList"></div></main>
<main id="cart" class="page"><h2>购物车</h2><div id="cartItems"></div><div id="cartTotal"></div></main>
<main id="orders" class="page"><h2>我的订单</h2><div id="orderList"></div></main>
<main id="mine" class="page"><div class="panel" style="background:linear-gradient(120deg,var(--brand),var(--green));color:white"><h2>欢迎来到古藤国际百货</h2><p>登录后享受更完整的会员服务与订单查看体验。</p></div></div></main>
<div class="modal" id="detailModal" onclick="if(event.target===this)closeModal('detailModal')"><section class="sheet"><div class="sheethead"><b>商品详情</b><button class="close" onclick="closeModal('detailModal')">×</button></div><div id="detailContent"></div></section></div>
<div class="modal" id="checkoutModal" onclick="if(event.target===this)closeModal('checkoutModal')"><section class="sheet"><div class="sheethead"><b>确认订单</b><button class="close" onclick="closeModal('checkoutModal')">×</button></div><div id="checkoutContent"></div></section></div>
<nav class="nav"><div class="navinner"><button class="active" data-tab="home"><strong>⌂</strong>首页</button><button data-tab="category"><strong>▦</strong>分类</button><button data-tab="cart"><strong>🛒</strong>购物车</button><button data-tab="orders"><strong>📦</strong>订单</button><button data-tab="mine"><strong>👤</strong>我的</button></div></nav>
<script>
const categories=[['全部','✨'],['家居生活','🏡'],['日用百货','🧴'],['服饰箱包','👜'],['数码配件','🎧'],['美妆个护','🌿']];
let items=[], chosen='全部', cart=JSON.parse(localStorage.getItem('guteng_cart_v2')||'{}');
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const money=n=>'¥'+Number(n||0).toFixed(2);
function toast(t){let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),1900)}
function saveCart(){localStorage.setItem('guteng_cart_v2',JSON.stringify(cart))}
function productImage(p,large=false){return p.image_url?`<img src="${escapeHTML(p.image_url)}" alt="${escapeHTML(p.name)}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit">`:`<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:${large?'2.5':'1.8'}rem;background:${escapeHTML(p.color||'#e8f0e9')};${large?'border-radius:24px;':''}">${escapeHTML(p.icon||'🛍️')}</div>`}
function renderCats(){cats.innerHTML=categories.map(([n,ic])=>`<button class="cat ${chosen===n?'active':''}" onclick="choose('${n}')"><span>${ic}</span>${n}</button>`).join('')}
function renderProducts(){let q=search.value.trim().toLowerCase();let a=items.filter(p=>(chosen==='全部'||p.category===chosen)&&(!q||p.name.toLowerCase().includes(q)||p.category.toLowerCase().includes(q)));products.innerHTML=a.map(p=>`<article class="product" onclick="detail('${p.id}')"><div class="photo">${productImage(p,false)}<span class="tag">${escapeHTML(p.category||'商品')}</span></div><div class="info"><div class="row"><h3>${escapeHTML(p.name)}</h3></div><div class="meta"><span class="price">${money(p.price_cny)}</span><button class="addbtn" onclick="event.stopPropagation();add('${p.id}')" ${p.stock<=0?'disabled':''}>${p.stock<=0?'售罄':'加入'}</button></div></div></article>`).join('')||'<div class="panel empty">暂无符合条件的商品</div>';catCount.textContent=categories.filter(([n])=>n!=='全部').length}
function choose(c){chosen=c;renderCats();renderProducts()}
function openModal(id){document.getElementById(id).classList.add('show')}function closeModal(id){document.getElementById(id).classList.remove('show')}
function detail(id){let p=items.find(x=>x.id===id);if(!p)return;detailContent.innerHTML=`<div class="detail"><div class="detailpic" style="background:${escapeHTML(p.color||'#e8f0e9')};overflow:hidden">${productImage(p,true)}</div><div><div class="pill">${escapeHTML(p.category||'商品')}</div><h2>${escapeHTML(p.name)}</h2><div class="price">${money(p.price_cny)}</div><div class="qty"><button onclick="changeQty('${p.id}',-1)">−</button><span id="detailQty">1</span><button onclick="changeQty('${p.id}',1)">＋</button></div><p class="desc">${escapeHTML(p.description||'暂无详细描述。')}</p><div class="listline"><span>库存</span><b>${p.stock>0?`${p.stock} 件可售`:'已售罄'}</b></div><div class="listline"><span>履约</span><b>${escapeHTML(p.fulfillment||'auto')}</b></div><div class="checkoutbox"><button onclick="add('${p.id}');closeModal('detailModal')">加入购物车</button></div></div></div>`}
function changeQty(id,d){const e=document.getElementById('detailQty');if(!e)return;let n=Number(e.textContent||1)+d;n=Math.max(1,n);e.textContent=n}
function add(id){let p=items.find(x=>x.id===id);if(!p||p.stock<=0){toast('该商品暂时无库存');return}let qty=Number(cart[id]||0);if(qty>=p.stock){toast('已达到当前可售库存');return}cart[id]=qty+1;saveCart();renderCart();toast('已加入购物车')}
function renderCart(){let keys=Object.keys(cart).filter(k=>items.some(p=>p.id===k));badge.textContent=keys.length?'('+keys.reduce((s,k)=>s+cart[k],0)+')':'';const total=keys.reduce((s,k)=>{let p=items.find(x=>x.id===k);return s+(p?Number(p.price_cny)*Number(cart[k]):0)},0);if(!keys.length){cartItems.innerHTML='<div class="panel empty">购物车为空，先挑几件喜欢的商品吧。</div>';cartTotal.innerHTML='';return}cartItems.innerHTML=keys.map(k=>{let p=items.find(x=>x.id===k);if(!p)return '';return `<div class="cartitem"><img src="${escapeHTML(p.image_url||'')}" alt="${escapeHTML(p.name)}"><div><div class="name">${escapeHTML(p.name)}</div><div class="meta"><span>${money(p.price_cny)}</span><div class="qty"><button onclick="change('${p.id}',-1)">−</button><span>${cart[k]}</span><button onclick="change('${p.id}',1)">＋</button></div></div></div><button class="cbutton" onclick="remove('${p.id}')">删除</button></div>`}).join('');cartTotal.innerHTML=`<div class="panel"><div class="listline"><span>商品合计</span><b>${money(total)}</b></div><div class="listline"><span>运费</span><b>待定</b></div><div class="listline"><span>总额</span><b>${money(total)}</b></div><div class="checkoutbox"><button onclick="openCheckout()">去结算</button></div></div>`}
function remove(id){delete cart[id];saveCart();renderCart();toast('已从购物车移除')}
function change(id,d){let p=items.find(x=>x.id===id);if(!p)return;cart[id]=Number(cart[id])+d;if(cart[id]<=0)delete cart[id];if(cart[id]>p.stock)cart[id]=p.stock;saveCart();renderCart()}
function openCheckout(){let keys=Object.keys(cart).filter(k=>items.some(p=>p.id===k));if(!keys.length){toast('购物车为空');return}let total=keys.reduce((s,k)=>{let p=items.find(x=>x.id===k);return s+(p?Number(p.price_cny)*Number(cart[k]):0)},0);checkoutContent.innerHTML=`<div class="panel"><div class="listline"><span>订单金额</span><b>${money(total)}</b></div><div class="listline"><span>支付状态</span><b>未启用</b></div><div class="listline"><span>说明</span><b>当前不接受真实付款</b></div><button class="cbutton" style="margin-top:12px" onclick="closeModal('checkoutModal')">知道了</button></div>`;openModal('checkoutModal')}
function renderOrders(){orderList.innerHTML='<div class="panel empty">订单中心尚未连接服务端订单系统。当前不会生成真实订单或收款记录。</div>'}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));['home','category','cart','orders','mine'].forEach(id=>document.getElementById(id).classList.toggle('show',id===b.dataset.tab));if(b.dataset.tab==='cart')renderCart();if(b.dataset.tab==='orders')renderOrders();if(b.dataset.tab==='mine')renderOrders();});
search.addEventListener('input',renderProducts);categoryList.innerHTML=categories.slice(1).map(([n,ic])=>`<div class="line" onclick="choose('${n}');document.querySelector('[data-tab=home]').click()" style="padding:10px 0;border-bottom:1px solid rgba(23,43,45,.05);cursor:pointer;display:flex;justify-content:space-between;align-items:center"><span>${ic} ${n}</span><b>→</b></div>`).join('');
async function loadProducts(){try{let r=await fetch('/api/products');if(!r.ok)throw new Error('HTTP '+r.status);let data=await r.json();items=(data.products||[]).map(p=>({...p,price_cny:Number(p.price_cny),stock:Number(p.stock||0)}));renderCats();renderProducts();renderCart();renderOrders();}catch(e){console.error(e);products.innerHTML='<div class="panel empty">商品数据加载失败，请检查 Worker / D1 配置。</div>'}}
renderCats();renderProducts();renderCart();renderOrders();loadProducts();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
