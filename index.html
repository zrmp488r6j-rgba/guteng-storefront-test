<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07505b"><meta name="description" content="古藤国际百货 GUTENG，精选品质生活好物。">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icon-192.png">
<title>古藤国际百货 GUTENG</title>
<style>
:root{--brand:#07505b;--green:#269b79;--gold:#d5a84f;--bg:#f5f7f6;--ink:#172b2d;--muted:#7b8988}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}button,input{font:inherit}button{cursor:pointer}.wrap{max-width:760px;margin:auto}.top{background:#fff;padding:12px 16px 10px;position:sticky;top:0;z-index:5;box-shadow:0 2px 12px #1231}.brand{display:flex;align-items:center;gap:10px;margin-bottom:12px}.brand img{width:44px;height:44px;object-fit:contain;border-radius:9px}.brand b{display:block;color:var(--brand);font-size:17px}.brand small{color:var(--green);letter-spacing:1.5px}.search{display:flex;background:#f1f4f3;border-radius:13px;padding:0 12px;align-items:center}.search input{border:0;background:transparent;outline:0;padding:12px;width:100%}.hero{margin:15px 16px;background:linear-gradient(120deg,var(--brand),var(--green));color:white;border-radius:20px;padding:23px;display:flex;align-items:center;justify-content:space-between;min-height:145px}.hero h1{font-size:23px;margin:0 0 8px}.hero p{margin:0;color:#d8eeea;font-size:13px}.hero .bag{font-size:54px}.section{padding:5px 16px 12px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:12px 0;font-weight:750}.sectionhead small{color:var(--muted);font-weight:400}.cats{display:flex;gap:10px;overflow:auto;padding-bottom:5px}.cat{border:0;background:white;border-radius:14px;min-width:75px;padding:12px 6px;color:var(--ink);font-size:12px}.cat span{display:block;font-size:25px;margin-bottom:6px}.cat.active{outline:2px solid var(--green);color:var(--brand)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;padding:0 12px 18px}.product{background:#fff;border-radius:16px;padding:10px;box-shadow:0 2px 12px #17321a0a}.pic{height:130px;border-radius:12px;display:grid;place-items:center;font-size:52px;background:#e8f0e9}.product h3{font-size:14px;margin:10px 0 5px}.muted{color:var(--muted);font-size:11px}.price{color:#b77c25;font-weight:800;font-size:18px}.buy{border:0;background:var(--brand);color:#fff;border-radius:50%;width:31px;height:31px;font-size:20px}.pfoot{display:flex;align-items:center;justify-content:space-between;margin-top:9px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e8eeeb;display:flex;justify-content:center;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:10}.navinner{width:min(760px,100%);display:flex;justify-content:space-around}.nav button{border:0;background:none;color:#87918f;font-size:11px;min-width:58px}.nav button strong{display:block;font-size:20px;font-weight:500;margin-bottom:2px}.nav button.active{color:var(--brand);font-weight:750}.page{padding:16px}.panel{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px}.line{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eef1ef}.line:last-child{border:0}.primary{background:var(--brand);color:white;border:0;border-radius:12px;padding:12px 18px}.secondary{background:#eaf2ef;color:var(--brand);border:0;border-radius:12px;padding:9px 12px}.empty{text-align:center;color:var(--muted);padding:48px 15px}.qty{display:flex;align-items:center;gap:10px}.qty button{border:0;background:#edf3f0;border-radius:50%;width:27px;height:27px;color:var(--brand)}.hidden{display:none!important}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#193d3c;color:white;padding:10px 16px;border-radius:20px;font-size:13px;z-index:20}.notice{font-size:11px;color:#8a9693;line-height:1.6;padding:12px 16px}.pill{display:inline-block;background:#f5eddb;color:#9b7026;border-radius:20px;padding:4px 9px;font-size:11px}.modal{position:fixed;inset:0;background:#102b2bb0;z-index:30;display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{background:var(--bg);width:min(760px,100%);max-height:92dvh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom))}.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.close{border:0;background:#e8efec;border-radius:50%;width:34px;height:34px;font-size:20px}.detailpic{height:220px;border-radius:18px;display:grid;place-items:center;font-size:88px;margin-bottom:16px}.field{display:block;margin:13px 0;font-size:13px;font-weight:650}.field input,.field textarea{display:block;width:100%;margin-top:7px;border:1px solid #dce5e0;border-radius:11px;background:white;padding:12px;font:inherit;outline-color:var(--green)}.field textarea{min-height:76px;resize:vertical}.choice{display:flex;gap:9px;align-items:center;background:#fff;padding:13px;border-radius:12px;margin:8px 0;font-size:14px}.totalrow{display:flex;justify-content:space-between;padding:10px 0}
</style></head><body><div class="wrap">
<header class="top"><div class="brand"><img src="assets/icon-192.png" alt="古藤国际百货标志"><div><b>古藤国际百货</b><small>GUTENG · 品质生活精选</small></div></div><div class="search">⌕ <input id="search" placeholder="搜索你喜欢的商品" aria-label="搜索商品"></div></header>
<main id="home"><section class="hero"><div><h1>发现品质好物</h1><p>精选日常好物 · 焕新美好生活</p><p style="margin-top:14px"><span class="pill">古藤自营 · 用心精选</span></p></div><div class="bag">🛍️</div></section><section class="section"><div class="sectionhead">商品分类 <small>精选生活好物</small></div><div class="cats" id="cats"></div></section><section class="section"><div class="sectionhead">为你精选 <small id="count"></small></div></section><div class="grid" id="products"></div><p class="notice">温馨提示：当前为可交互演示版，商品、价格、订单均为本机测试数据；尚未接入真实账号、库存、物流及支付。</p></main>
<main id="category" class="page hidden"><h2>全部分类</h2><div class="panel" id="categoryList"></div></main>
<main id="cart" class="page hidden"><h2>购物车</h2><div id="cartItems"></div><div id="cartTotal"></div></main>
<main id="orders" class="page hidden"><h2>我的订单</h2><div id="orderList"></div></main>
<main id="mine" class="page hidden"><div class="panel" style="background:linear-gradient(120deg,var(--brand),var(--green));color:white"><h2>欢迎来到古藤国际百货</h2><p>登录后享受完整购物服务</p><button class="secondary" onclick="toast('登录功能将在正式版本开放')">登录 / 注册</button></div><div class="panel"><div class="line">收货地址 <span>›</span></div><div class="line">优惠券 <span>›</span></div><div class="line">联系客服 <span>›</span></div><div class="line">关于古藤国际百货 <span>›</span></div></div></main>
<div class="modal" id="detailModal" onclick="if(event.target===this)closeModal('detailModal')"><section class="sheet"><div class="sheethead"><b>商品详情</b><button class="close" onclick="closeModal('detailModal')">×</button></div><div id="detailContent"></div></section></div>
<div class="modal" id="checkoutModal" onclick="if(event.target===this)closeModal('checkoutModal')"><section class="sheet"><div class="sheethead"><b>确认订单</b><button class="close" onclick="closeModal('checkoutModal')">×</button></div><div id="checkoutContent"></div></section></div>
<nav class="nav"><div class="navinner"><button class="active" data-tab="home"><strong>⌂</strong>首页</button><button data-tab="category"><strong>▦</strong>分类</button><button data-tab="cart"><strong>🛒</strong>购物车 <span id="badge"></span></button><button data-tab="orders"><strong>▤</strong>订单</button><button data-tab="mine"><strong>♙</strong>我的</button></div></nav></div>
<script>
const categories=[['全部','✨'],['家居生活','🏡'],['日用百货','🧴'],['服饰箱包','👜'],['数码配件','🎧'],['美妆个护','🌿']];
let items=[], chosen='全部', cart=JSON.parse(localStorage.getItem('guteng_cart_v2')||'{}');
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'¥'+Number(n||0).toFixed(2);
function toast(t){let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),1900)}
function saveCart(){localStorage.setItem('guteng_cart_v2',JSON.stringify(cart))}
function productImage(p,large=false){return p.image_url?`<img src="${escapeHTML(p.image_url)}" alt="${escapeHTML(p.name)}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit">`:escapeHTML(p.icon||'🛍️')}
function renderCats(){cats.innerHTML=categories.map(([n,ic])=>`<button class="cat ${chosen===n?'active':''}" onclick="choose('${n}')"><span>${ic}</span>${n}</button>`).join('')}
function renderProducts(){let q=search.value.trim().toLowerCase();let a=items.filter(p=>(chosen==='全部'||p.category===chosen)&&(!q||p.name.toLowerCase().includes(q)||p.category.toLowerCase().includes(q)));count.textContent=`共 ${a.length} 件`;products.innerHTML=a.map(p=>`<article class="product"><div class="pic" style="background:${escapeHTML(p.color||'#e8f0e9')}" onclick="detail('${p.id}')">${productImage(p)}</div><h3 onclick="detail('${p.id}')">${escapeHTML(p.name)}</h3><div class="muted">${escapeHTML(p.category)} · 库存 ${Number(p.stock||0)}</div><div class="pfoot"><span class="price">${money(p.price_cny)}</span><button class="buy" onclick="add('${p.id}')" ${p.stock<=0?'disabled':''}>+</button></div></article>`).join('')||'<div class="empty">暂无已上架商品，敬请期待</div>'}
function choose(c){chosen=c;renderCats();renderProducts()}
function openModal(id){document.getElementById(id).classList.add('show')}function closeModal(id){document.getElementById(id).classList.remove('show')}
function detail(id){let p=items.find(x=>x.id===id);if(!p)return;detailContent.innerHTML=`<div class="detailpic" style="background:${escapeHTML(p.color||'#e8f0e9')};overflow:hidden">${productImage(p,true)}</div><h2 style="margin:0 0 7px">${escapeHTML(p.name)}</h2><div class="muted">${escapeHTML(p.category)} · SKU ${escapeHTML(p.sku||'—')}</div><p style="line-height:1.8;color:#596966">${escapeHTML(p.description||'')}</p><div class="price" style="font-size:25px;margin:16px 0">${money(p.price_cny)}</div><div class="panel"><b>库存：${Number(p.stock||0)}</b><p class="muted">具体配送范围和时效将在结账功能开放前确认。</p></div><button class="primary" style="width:100%" onclick="add('${p.id}');closeModal('detailModal')" ${p.stock<=0?'disabled':''}>加入购物车</button>`;openModal('detailModal')}
function add(id){let p=items.find(x=>x.id===id);if(!p||p.stock<=0){toast('该商品暂时无库存');return}let qty=Number(cart[id]||0);if(qty>=p.stock){toast('已达到当前可售库存');return}cart[id]=qty+1;saveCart();renderCart();toast('已加入购物车')}
function renderCart(){let keys=Object.keys(cart).filter(k=>items.some(p=>p.id===k));badge.textContent=keys.length?'('+keys.reduce((s,k)=>s+cart[k],0)+')':'';if(!keys.length){cartItems.innerHTML='<div class="panel empty">🛒<p>购物车还是空的</p><small>去首页挑选一些喜欢的商品吧</small></div>';cartTotal.innerHTML='';return}cartItems.innerHTML=keys.map(k=>{let p=items.find(x=>x.id===k);return `<div class="panel"><div class="line"><div><b>${escapeHTML(p.name)}</b><div class="muted">${money(p.price_cny)} · 库存 ${p.stock}</div></div><div class="qty"><button onclick="change('${k}',-1)">−</button>${cart[k]}<button onclick="change('${k}',1)" ${cart[k]>=p.stock?'disabled':''}>+</button></div></div></div>`}).join('');let sum=keys.reduce((s,k)=>s+items.find(p=>p.id===k).price_cny*cart[k],0);cartTotal.innerHTML=`<div class="panel"><div class="line"><b>商品合计</b><b class="price">${money(sum)}</b></div><p class="notice">在线支付、运费报价和税费核算尚未启用，暂不接受真实订单。</p><button class="primary" style="width:100%;opacity:.55" disabled>暂未开放结算</button></div>`}
function change(id,d){let p=items.find(x=>x.id===id);if(!p)return;cart[id]=Number(cart[id])+d;if(cart[id]<=0)delete cart[id];if(cart[id]>p.stock)cart[id]=p.stock;saveCart();renderCart()}
function renderOrders(){orderList.innerHTML='<div class="panel empty">订单中心尚未连接服务端订单系统。当前不会生成真实订单或收款记录。</div>'}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));['home','category','cart','orders','mine'].forEach(id=>document.getElementById(id).classList.toggle('hidden',id!==b.dataset.tab));if(b.dataset.tab==='cart')renderCart()});
search.addEventListener('input',renderProducts);categoryList.innerHTML=categories.slice(1).map(([n,ic])=>`<div class="line" onclick="choose('${n}');document.querySelector('[data-tab=home]').click()">${ic}　${n}<span>›</span></div>`).join('');
async function loadProducts(){try{let r=await fetch('/api/products');if(!r.ok)throw new Error('HTTP '+r.status);let data=await r.json();items=(data.products||[]).map(p=>({...p,price_cny:Number(p.price_cny),stock:Number(p.stock)}));renderCats();renderProducts();renderCart()}catch(e){products.innerHTML='<div class="empty">商品暂时无法加载，请稍后重试</div>';console.error(e)}}
renderCats();renderProducts();renderCart();renderOrders();loadProducts();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
